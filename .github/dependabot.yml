version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 20
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: "weekly"
      day: friday
      time: "04:10"
    groups:
      docker-dependencies:
        patterns:
          - "*"
